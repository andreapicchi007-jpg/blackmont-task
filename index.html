<style>

/* VOICE: premium, preciso, operativo — una console di controllo del desk support.
   IDEA: il pannello operativo di un broker: righe di ticket con un interruttore "fatto".
   PICTURE: la lista task stessa, in vetro su un fondo blu notte con linee di griglia argentate.
   COLOUR and TYPE: blu notte #060b18, argento #c9d3e3, accento blu elettrico #3d8bff; Michroma per il marchio, Inter per il resto.
   LAYOUT: header con logo, barra di stato, composer (solo admin), filtri, lista; una colonna su mobile. */
:root{color-scheme:dark;--bg:#060b18;--bg2:#0b1430;--glass:rgba(150,180,230,.06);--line:rgba(201,211,227,.14);--ink:#e8eef8;--mute:#8d9bb4;--silver:#c9d3e3;--blue:#3d8bff;--blue2:#7fb2ff;--ok:#43d6a0;--warn:#ffb547;--hot:#ff5d73}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#14306e 0,transparent 60%),radial-gradient(900px 500px at -10% 10%,#0f2250 0,transparent 55%),var(--bg);color:var(--ink);font:16px/1.55 Inter,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
body::before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.5),transparent 70%);opacity:.35}
.wrap{position:relative;max-width:980px;margin:0 auto;padding:clamp(20px,4vw,48px) max(4vw,16px) 64px}
header{display:flex;align-items:center;gap:18px;flex-wrap:wrap;margin-bottom:28px}
.logo{width:84px;height:84px;flex:none;border-radius:50%;box-shadow:0 0 0 1px rgba(201,211,227,.25),0 0 36px rgba(61,139,255,.55)}
.brand h1{margin:0;font:600 clamp(22px,3.8vw,34px)/1.1 Cinzel,serif;letter-spacing:.08em;background:linear-gradient(180deg,#fff 0,#c9d3e3 55%,#7d8aa3 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand p{margin:6px 0 0;color:var(--mute);font-size:14px}
.who{margin-left:auto;font-size:13px;color:var(--mute);padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--glass)}
.who b{color:var(--silver);font-weight:600}
.panel{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.015));border:1px solid var(--line);border-radius:18px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.08)}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) minmax(0,2fr);gap:0;margin-bottom:18px;overflow:hidden}
.stat{padding:16px 18px;border-right:1px solid var(--line)}
.stat span{display:block;font-size:13px;color:var(--mute)}
.stat strong{font:600 28px/1.2 Inter,sans-serif;font-variant-numeric:tabular-nums;color:var(--silver)}
.prog{padding:16px 18px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.prog span{font-size:13px;color:var(--mute);display:flex;justify-content:space-between}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.07);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--blue2),#e6efff);box-shadow:0 0 14px var(--blue);transition:width .6s ease}
form.composer{padding:18px;margin-bottom:18px;display:grid;grid-template-columns:minmax(0,1fr) 150px 160px auto;gap:10px}
.composer .full{grid-column:1/-1}
input,select,textarea,button{font:inherit;font-size:16px;color:var(--ink)}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(6,11,24,.6);outline:none}
textarea{min-height:44px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible{border-color:var(--blue);box-shadow:0 0 0 3px rgba(61,139,255,.25)}
select option{background:#0b1430}
.btn{min-height:44px;padding:10px 20px;border-radius:12px;border:1px solid rgba(127,178,255,.5);background:linear-gradient(180deg,#4a95ff,#1f5fd6);color:#fff;font-weight:600;cursor:pointer;box-shadow:0 6px 24px rgba(61,139,255,.35),inset 0 1px 0 rgba(255,255,255,.3)}
.btn:hover{filter:brightness(1.1)}
.ghost{background:transparent;border:1px solid var(--line);color:var(--mute);box-shadow:none;font-weight:500}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.tabs{display:flex;gap:4px;padding:4px;border-radius:14px;border:1px solid var(--line);background:var(--glass)}
.tabs button{min-height:40px;padding:6px 14px;border-radius:10px;border:0;background:transparent;color:var(--mute);cursor:pointer;font-size:14px;font-weight:500}
.tabs button[aria-pressed=true]{background:linear-gradient(180deg,rgba(201,211,227,.22),rgba(201,211,227,.08));color:#fff;box-shadow:inset 0 1px 0 rgba(255,255,255,.15)}
.tools input{flex:1 1 200px;width:auto}
ul.list{list-style:none;margin:0;padding:6px}
.task{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:start;padding:14px 12px;border-radius:14px;transition:background .2s}
.task+.task{border-top:1px solid rgba(201,211,227,.07)}
.task:hover{background:rgba(255,255,255,.03)}
.chk{width:44px;height:44px;border-radius:12px;border:1.5px solid rgba(201,211,227,.4);background:rgba(6,11,24,.6);cursor:pointer;display:grid;place-items:center;padding:0;transition:all .2s}
.chk svg{width:22px;height:22px;opacity:0;transform:scale(.6);transition:all .2s}
.done .chk{border-color:var(--ok);background:rgba(67,214,160,.15);box-shadow:0 0 16px rgba(67,214,160,.35)}
.done .chk svg{opacity:1;transform:none}
.t-title{font-weight:600;font-size:16px;margin-top:2px;overflow-wrap:anywhere}
.done .t-title{color:var(--mute);text-decoration:line-through;text-decoration-color:rgba(141,155,180,.6)}
.t-note{color:var(--mute);font-size:14px;margin-top:3px;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;font-size:13px;color:var(--mute)}
.pill{padding:2px 10px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.p-alta{color:var(--hot);border-color:rgba(255,93,115,.4)}
.p-media{color:var(--warn);border-color:rgba(255,181,71,.35)}
.p-bassa{color:var(--blue2);border-color:rgba(127,178,255,.35)}
.late{color:var(--hot)}
.okby{color:var(--ok)}
.del{width:40px;height:40px;border-radius:10px;border:1px solid transparent;background:transparent;color:var(--mute);cursor:pointer;font-size:18px}
.del:hover{border-color:rgba(255,93,115,.4);color:var(--hot)}
.empty{padding:48px 20px;text-align:center;color:var(--mute)}
.empty b{display:block;font:400 16px Michroma,sans-serif;color:var(--silver);margin-bottom:6px}
.note{font-size:13px;color:var(--mute);margin:14px 4px 0}
.banner{padding:12px 16px;margin-bottom:16px;border-radius:12px;border:1px solid rgba(255,181,71,.35);background:rgba(255,181,71,.08);color:#ffd9a0;font-size:14px;display:none}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);opacity:0;padding:10px 16px;border-radius:12px;background:#0f1d40;border:1px solid var(--line);font-size:14px;transition:all .25s;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
@media(max-width:720px){.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.prog{grid-column:1/-1;border-top:1px solid var(--line)}.stat:nth-child(3){border-right:0}form.composer{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}.composer .t{grid-column:1/-1}.composer .btn{grid-column:1/-1}.who{margin-left:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

.login{max-width:420px;margin:8vh auto 0;padding:28px;display:grid;gap:12px;text-align:center}
.login img{width:110px;height:110px;margin:0 auto 6px;border-radius:50%;box-shadow:0 0 0 1px rgba(201,211,227,.25),0 0 40px rgba(61,139,255,.55)}
.login h2{margin:0 0 6px;font:600 22px/1.2 Cinzel,serif;letter-spacing:.08em;color:var(--silver)}
.login .err{color:var(--hot);font-size:14px;min-height:20px}
.out{min-height:36px;padding:6px 12px;font-size:13px;margin-left:8px}
</style>
</head>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
{
const CFG=window.BLACKMONT_CONFIG||{};
const DEMO=!CFG.SUPABASE_URL||!CFG.SUPABASE_ANON_KEY;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let tasks=[],filter='open',query='',admin=false,sb=null,channel=null;
const PR={alta:0,media:1,bassa:2};
const today=()=>new Date().toISOString().slice(0,10);
const fmtDate=d=>{if(!d)return'';const[y,m,g]=String(d).slice(0,10).split('-');return g+'/'+m+'/'+y};
const fmtTs=t=>{if(!t)return'';const d=new Date(t);return d.toLocaleDateString('it-IT',{day:'2-digit',month:'2-digit'})+' '+d.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'})};
const ts=t=>t?new Date(t).getTime():0;
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2200)}
function banner(m){const b=$('#banner');b.textContent=m;b.style.display=m?'block':'none'}

/* ---------- storage: Supabase o demo locale ---------- */
const LS='blackmont_tasks_demo';
const demoLoad=()=>{try{return JSON.parse(localStorage.getItem(LS))||[]}catch(e){return[]}};
const demoSave=()=>{try{localStorage.setItem(LS,JSON.stringify(tasks))}catch(e){}};
const api={
  async list(){if(DEMO)return demoLoad();const{data,error}=await sb.from('tasks').select('*').order('created_at',{ascending:false});if(error)throw error;return data},
  async add(t){if(DEMO){tasks.push({...t,id:crypto.randomUUID?crypto.randomUUID():String(Date.now()),created_at:new Date().toISOString(),done:false});demoSave();return}const{error}=await sb.from('tasks').insert(t);if(error)throw error},
  async toggle(id,val){if(DEMO){const x=tasks.find(t=>t.id===id);x.done=val;x.done_by=val?'Demo':null;x.done_at=val?new Date().toISOString():null;demoSave();return}const{error}=await sb.rpc('toggle_task',{task_id:id,value:val});if(error)throw error},
  async del(id){if(DEMO){tasks=tasks.filter(t=>t.id!==id);demoSave();return}const{error}=await sb.from('tasks').delete().eq('id',id);if(error)throw error}
};

async function refresh(){try{tasks=await api.list();banner(DEMO?'Modalità demo: le task sono salvate solo in questo browser. Compila config.js per collegare il database del team.':'')}catch(e){banner('Non riesco a leggere le task: '+(e.message||'errore'))}render()}

function render(){
  const open=tasks.filter(t=>!t.done),done=tasks.filter(t=>t.done);
  const late=open.filter(t=>t.due&&t.due<today()).length;
  $('#sOpen').textContent=open.length;$('#sDone').textContent=done.length;$('#sLate').textContent=late;
  const pct=tasks.length?Math.round(done.length/tasks.length*100):0;
  $('#sPct').textContent=pct+'%';$('#sBar').style.width=pct+'%';
  let rows=filter==='open'?open:filter==='done'?done:tasks.slice();
  if(query){const q=query.toLowerCase();rows=rows.filter(t=>(t.title+' '+(t.note||'')).toLowerCase().includes(q))}
  const D=t=>t.due||'9999';
  rows.sort((a,b)=>filter==='done'?ts(b.done_at)-ts(a.done_at):(a.done-b.done)||(PR[a.prio]-PR[b.prio])||(D(a)<D(b)?-1:D(a)>D(b)?1:0)||(ts(b.created_at)-ts(a.created_at)));
  const L=$('#list');
  if(!rows.length){
    L.innerHTML=`<li class="empty"><b>${tasks.length?'Nessuna task qui':'Nessuna task ancora'}</b>${tasks.length?(filter==='open'?'Tutto completato. Ottimo lavoro.':'Prova un altro filtro.'):(admin?'Scrivi la prima task qui sopra.':'Le task scritte dal management appariranno qui.')}</li>`;return}
  L.innerHTML=rows.map(t=>{
    const isLate=!t.done&&t.due&&t.due<today();
    return `<li class="task ${t.done?'done':''}" data-id="${esc(t.id)}">
      <button class="chk" type="button" aria-pressed="${!!t.done}" aria-label="${t.done?'Segna da fare':'Segna come fatta'}"><svg viewBox="0 0 24 24"><path d="M5 12.5 10 17 19 7" fill="none" stroke="#43d6a0" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div>
        <div class="t-title">${esc(t.title)}</div>
        ${t.note?`<div class="t-note">${esc(t.note)}</div>`:''}
        <div class="meta">
          <span class="pill p-${esc(t.prio)}">${esc(t.prio)}</span>
          ${t.due?`<span class="pill ${isLate?'late':''}">${isLate?'Scaduta ':'Entro '}${fmtDate(t.due)}</span>`:''}
          ${t.done?`<span class="okby">✓ Fatta${t.done_by?' da '+esc(t.done_by):''} · ${fmtTs(t.done_at)}</span>`:''}
        </div>
      </div>
      ${admin?`<button class="del" type="button" aria-label="Elimina task" title="Elimina">×</button>`:'<span></span>'}
    </li>`}).join('');
}

$('#composer').addEventListener('submit',async e=>{
  e.preventDefault();const title=$('#fTitle').value.trim();if(!title)return;
  try{await api.add({title,note:$('#fNote').value.trim(),prio:$('#fPrio').value,due:$('#fDue').value||null});
    $('#fTitle').value='';$('#fNote').value='';$('#fDue').value='';$('#fTitle').focus();toast('Task aggiunta');await refresh()}
  catch(err){toast('Salvataggio non riuscito')}
});
$('#list').addEventListener('click',async e=>{
  const li=e.target.closest('.task');if(!li)return;const t=tasks.find(x=>String(x.id)===li.dataset.id);if(!t)return;
  if(e.target.closest('.chk')){
    const v=!t.done;try{await api.toggle(t.id,v);toast(v?'Segnata come fatta':'Riaperta');await refresh()}catch(err){toast('Modifica non riuscita')}
  }else if(e.target.closest('.del')){
    const d=e.target.closest('.del');
    if(li.dataset.confirm!=='1'){li.dataset.confirm='1';d.textContent='?';toast('Tocca di nuovo per eliminare');setTimeout(()=>{li.dataset.confirm='';d.textContent='×'},3000);return}
    try{await api.del(t.id);toast('Task eliminata');await refresh()}catch(err){toast('Eliminazione non riuscita')}
  }
});
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{filter=b.dataset.f;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',x===b));render()}));
$('#q').addEventListener('input',e=>{query=e.target.value.trim();render()});

/* ---------- sessione ---------- */
async function enter(session){
  $('#loginView').hidden=true;$('#appView').hidden=false;
  if(DEMO){admin=true;$('#who').innerHTML='<b>Demo</b> · Admin';$('#logout').hidden=true}
  else{
    const email=session.user.email;
    const{data}=await sb.from('team').select('name,role').eq('email',email).maybeSingle();
    if(!data){banner('Il tuo account non è nel team. Chiedi a un admin di aggiungerti.');admin=false}
    else admin=data.role==='admin';
    $('#who').innerHTML=`<b>${esc(data?.name||email)}</b> · ${admin?'Admin':'Support'}`;
    if(channel)sb.removeChannel(channel);
    channel=sb.channel('tasks-live').on('postgres_changes',{event:'*',schema:'public',table:'tasks'},()=>refresh()).subscribe();
  }
  $('#composer').hidden=!admin;
  if(!admin)$('#foot').textContent='Spunta il quadrato quando hai completato una task: il management vede subito chi l’ha fatta e quando.';
  await refresh();
}
function showLogin(){$('#appView').hidden=true;$('#loginView').hidden=false}

$('#loginForm').addEventListener('submit',async e=>{
  e.preventDefault();$('#lErr').textContent='';
  const{data,error}=await sb.auth.signInWithPassword({email:$('#lEmail').value.trim(),password:$('#lPass').value});
  if(error){$('#lErr').textContent='Email o password non corretti';return}
  enter(data.session);
});
$('#logout').addEventListener('click',async()=>{await sb.auth.signOut();if(channel)sb.removeChannel(channel);tasks=[];showLogin()});

(async()=>{
  if(DEMO){enter(null);return}
  if(!window.supabase){document.body.insertAdjacentHTML('afterbegin','<p class="banner" style="display:block;margin:16px">Libreria Supabase non caricata: controlla la connessione.</p>');return}
  sb=window.supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY);
  const{data}=await sb.auth.getSession();
  data.session?enter(data.session):showLogin();
})();
}
</script>
</body>
</html>
